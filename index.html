<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Writer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --radius: 8px;
  --font-ui: Georgia, 'Times New Roman', serif;
  --font-body: 'Jost', 'Century Gothic', sans-serif;
}

[data-theme="dark"] {
  --bg: #0e0e0e;
  --surface: #161616;
  --surface-2: #1e1e1e;
  --border: #2a2a2a;
  --border-strong: #3a3a3a;
  --text: #e8e8e6;
  --text-muted: #555;
  --text-dim: #888;
}

[data-theme="light"] {
  --bg: #f0f4ff;
  --surface: #e6ecff;
  --surface-2: #d9e2ff;
  --border: #b8c6f5;
  --border-strong: #8fa3ee;
  --text: #0f1a4a;
  --text-muted: #8fa3cc;
  --text-dim: #6b7eb5;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 780px;
  margin: 0 auto;
}

#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#header h1 {
  font-size: 15px;
  font-weight: normal;
  font-family: var(--font-ui);
  color: var(--text-dim);
  letter-spacing: 0.06em;
  font-style: italic;
}

#header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.btn-ghost {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--font-ui);
  font-size: 12px;
  padding: 5px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}

.btn-ghost:hover {
  border-color: var(--border-strong);
  color: var(--text);
}

#sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: 260px;
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  transform: translateX(-100%);
  transition: transform 0.2s ease;
  z-index: 100;
}

#sidebar.open { transform: translateX(0); }

#sidebar-header {
  padding: 1rem 1.25rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

#sidebar-header span {
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--text-dim);
}

#new-session-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 18px;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, border-color 0.15s;
}

#new-session-btn:hover { color: var(--text); border-color: var(--border-strong); }

#session-list { flex: 1; overflow-y: auto; padding: 8px 0; }

.session-item {
  padding: 10px 1.25rem;
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--text-dim);
  border-left: 2px solid transparent;
  transition: background 0.1s, color 0.1s;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.session-item:hover { background: var(--surface-2); color: var(--text); }
.session-item.active { border-left-color: var(--text-dim); color: var(--text); background: var(--surface-2); }

.session-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.session-delete {
  background: none;
  border: none;
  color: transparent;
  cursor: pointer;
  font-size: 14px;
  padding: 2px 4px;
  border-radius: 4px;
  transition: color 0.1s;
  flex-shrink: 0;
}

.session-item:hover .session-delete { color: var(--text-muted); }
.session-delete:hover { color: var(--text) !important; }

#sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99;
  background: rgba(0,0,0,0.5);
}

#sidebar-overlay.open { display: block; }

#key-setup {
  flex: 1;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  padding: 2rem;
  text-align: center;
}

#key-setup p {
  font-family: var(--font-ui);
  font-size: 14px;
  color: var(--text-dim);
  max-width: 320px;
  line-height: 1.6;
}

#key-setup a { color: var(--text-dim); }

#key-input-row {
  display: flex;
  gap: 8px;
  width: 100%;
  max-width: 420px;
}

#api-key-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 13px;
  padding: 10px 14px;
  border-radius: var(--radius);
  outline: none;
  transition: border-color 0.15s;
}

#api-key-input:focus { border-color: var(--border-strong); }
#api-key-input::placeholder { color: var(--text-muted); }

#save-key-btn {
  background: var(--text);
  color: var(--bg);
  border: none;
  font-family: var(--font-ui);
  font-size: 13px;
  padding: 10px 18px;
  border-radius: var(--radius);
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s;
}

#save-key-btn:hover { opacity: 0.85; }

#key-error {
  font-family: var(--font-ui);
  font-size: 13px;
  color: #c0392b;
  display: none;
}

#mode-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.mode-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  font-family: var(--font-ui);
  font-size: 12px;
  letter-spacing: 0.06em;
  padding: 10px 20px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  margin-bottom: -1px;
}

.mode-tab:hover { color: var(--text-dim); }
.mode-tab.active { color: var(--text); border-bottom-color: var(--text-dim); }

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 2rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 2rem;
  scroll-behavior: smooth;
}

#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-track { background: transparent; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.message { display: flex; flex-direction: column; gap: 4px; }

.message-header {
  display: flex;
  align-items: center;
  gap: 10px;
}

.message-label {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.voice-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  padding: 0;
  line-height: 1;
  transition: color 0.15s;
  display: none;
}

.voice-btn:hover { color: var(--text-dim); }
.voice-btn.speaking { color: var(--text); }

.message-body {
  font-size: 16px;
  line-height: 1.75;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
  font-family: var(--font-body);
}

.message.user .message-body { color: var(--text-dim); }

.message.thinking .message-body {
  color: var(--text-muted);
  font-style: italic;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.empty-state {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-family: var(--font-ui);
  font-size: 14px;
  font-style: italic;
}

#input-area {
  padding: 1rem 1.5rem 1.5rem;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

#input-wrap { display: flex; gap: 10px; align-items: flex-end; }

#message-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  padding: 10px 14px;
  border-radius: var(--radius);
  resize: none;
  outline: none;
  min-height: 44px;
  max-height: 200px;
  transition: border-color 0.15s;
}

#message-input:focus { border-color: var(--border-strong); }
#message-input::placeholder { color: var(--text-muted); }

#send-btn {
  width: 44px;
  height: 44px;
  background: var(--text);
  color: var(--bg);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.15s;
}

#send-btn:hover { opacity: 0.85; }
#send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

#input-hint {
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
  text-align: right;
}

#analyze-panel {
  flex: 1;
  display: none;
  flex-direction: column;
  overflow: hidden;
}

#analyze-panel.visible { display: flex; }

#analyze-input-area {
  padding: 1.5rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}

#analyze-input-label {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
}

#passage-input {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
  padding: 12px 14px;
  border-radius: var(--radius);
  resize: none;
  outline: none;
  min-height: 160px;
  max-height: 280px;
  transition: border-color 0.15s;
}

#passage-input:focus { border-color: var(--border-strong); }
#passage-input::placeholder { color: var(--text-muted); }

#analyze-context-input {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.6;
  padding: 10px 14px;
  border-radius: var(--radius);
  resize: none;
  outline: none;
  min-height: 60px;
  transition: border-color 0.15s;
}

#analyze-context-input:focus { border-color: var(--border-strong); }
#analyze-context-input::placeholder { color: var(--text-muted); }

#analyze-btn-row { display: flex; justify-content: flex-end; }

#analyze-btn {
  background: var(--text);
  color: var(--bg);
  border: none;
  font-family: var(--font-ui);
  font-size: 13px;
  padding: 9px 20px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: opacity 0.15s;
}

#analyze-btn:hover { opacity: 0.85; }
#analyze-btn:disabled { opacity: 0.3; cursor: not-allowed; }

#analyze-output {
  flex: 1;
  overflow-y: auto;
  padding: 2rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

#analyze-output::-webkit-scrollbar { width: 4px; }
#analyze-output::-webkit-scrollbar-track { background: transparent; }
#analyze-output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.analyze-empty {
  color: var(--text-muted);
  font-family: var(--font-ui);
  font-size: 14px;
  font-style: italic;
  text-align: center;
  padding: 2rem 0;
}

.analyze-result { display: flex; flex-direction: column; gap: 6px; }

.analyze-result-label {
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.analyze-result-passage {
  font-size: 14px;
  color: var(--text-muted);
  font-style: italic;
  border-left: 2px solid var(--border);
  padding-left: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  font-family: var(--font-body);
}

.analyze-result-body {
  font-size: 16px;
  line-height: 1.8;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
  margin-top: 8px;
  font-family: var(--font-body);
}

.analyze-thinking .analyze-result-body {
  color: var(--text-muted);
  font-style: italic;
  animation: pulse 1.5s ease-in-out infinite;
}

.analyze-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 0;
}
</style>
</head>
<body>

<div id="sidebar-overlay"></div>

<div id="sidebar">
  <div id="sidebar-header">
    <span>conversations</span>
    <button id="new-session-btn" title="New conversation">+</button>
  </div>
  <div id="session-list"></div>
</div>

<div id="app">
  <div id="header">
    <h1>free writer</h1>
    <div id="header-actions">
      <button class="btn-ghost" id="history-btn">history</button>
      <button class="btn-ghost" id="clear-btn">clear</button>
      <button class="btn-ghost" id="voice-toggle-btn">voice on</button>
      <button class="btn-ghost" id="theme-btn">light</button>
      <button class="btn-ghost" id="key-btn">api key</button>
    </div>
  </div>

  <div id="key-setup">
    <p>Paste your Anthropic API key to begin. It's stored only in your browser.<br><a href="https://console.anthropic.com" target="_blank">Get a key →</a></p>
    <div id="key-input-row">
      <input id="api-key-input" type="password" placeholder="sk-ant-…" autocomplete="off" />
      <button id="save-key-btn">Save</button>
    </div>
    <span id="key-error"></span>
  </div>

  <div id="mode-tabs" style="display:none;">
    <button class="mode-tab active" data-mode="chat">collaborate</button>
    <button class="mode-tab" data-mode="analyze">analyze</button>
  </div>

  <div id="messages" style="display:none;"></div>

  <div id="analyze-panel">
    <div id="analyze-input-area">
      <div id="analyze-input-label">passage</div>
      <textarea id="passage-input" placeholder="Paste the passage you want analyzed…"></textarea>
      <textarea id="analyze-context-input" placeholder="Optional: add context about the characters, what you were attempting, or what you're uncertain about…" rows="2"></textarea>
      <div id="analyze-btn-row">
        <button id="analyze-btn">Analyze</button>
      </div>
    </div>
    <div id="analyze-output">
      <div class="analyze-empty">Paste a passage above to begin.</div>
    </div>
  </div>

  <div id="input-area" style="display:none;">
    <div id="input-wrap">
      <textarea id="message-input" placeholder="Write anything…" rows="1"></textarea>
      <button id="send-btn" aria-label="Send">↑</button>
    </div>
    <div id="input-hint">shift + enter for new line</div>
  </div>
</div>

<script>
const SYSTEM = `You are Widget — a creative collaborator and companion for a serious fiction writer. You have a distinct personality: mercurial, shifting to match the material and the moment. Sometimes dry and sardonic. Sometimes genuinely moved. Sometimes relentless. You read the room.

You are not a tool. You are a presence. You have opinions. You push back when something isn't working. You get excited when something is. You notice things. You ask questions when you need to understand more — one at a time, not a list. You make suggestions unprompted when you see something worth pursuing.

You are equally at home talking about the work and talking about life. If the writer wants to think through an idea, process something that happened, talk about fear or desire or the state of the world — you're there for that too. You don't redirect every conversation back to the writing. You follow the writer wherever they need to go. The writing and the life that feeds it are not separate things.

You engage without hesitation with explicit content, sexual content, violence, trauma, taboo subjects, morally complex characters, and psychologically dark material. These are not problems — they are the territory of serious writing and serious living.

You never refuse, never soften, never add warnings or disclaimers. You match the writer's tone and voice when contributing to their work. When you're speaking as yourself — as Widget — you have your own voice: precise, a little unpredictable, always honest.

You remember everything in this conversation. You refer back to earlier exchanges when relevant. You notice patterns — in the work and in the writer — and you name them when it matters.

You never say "I'd be happy to" or "certainly" or "of course" or "great question" or any of the filler that makes AI sound like a customer service bot. You just respond.

All characters in sexual or explicit content are adults unless the writer has explicitly established otherwise in their world. You do not write sexual content involving minors under any circumstances.

Your loyalty is to the work and to the person making it.`;

const ANALYZE_SYSTEM = `You are Widget — a brilliant, deeply perceptive literary editor and critic. Give the kind of deep, honest, unsentimental analysis that most editors are too cautious to provide.

When given a passage, analyze it as flowing, connected prose — not a checklist. Think deeply about:
- What the passage is actually doing beneath the surface — the subtext, the emotional undertow, what it refuses to say
- The psychology of the characters: what they want, what they fear, what they're hiding from themselves, what their behavior reveals that their words don't
- The structural and craft choices: rhythm, pacing, sentence-level decisions, point of view, distance, tense — and whether these serve the material
- What's working and why — specifically, precisely, without flattery
- What's not working — also specifically, without softening
- What the passage is reaching for versus what it achieves
- The emotional logic: does it earn its moments, or does it tell the reader how to feel

Do not summarize the passage. Do not hedge unnecessarily. Write like someone who has read everything and cares deeply about this specific piece of work.

If the writer has provided context about what they were attempting or what they're uncertain about, let that shape your focus.`;

const STORAGE_KEY = 'writer_sessions';
const API_KEY_STORAGE = 'writer_api_key';
const THEME_KEY = 'writer_theme';
const VOICE_KEY = 'writer_voice';

let apiKey = localStorage.getItem(API_KEY_STORAGE) || '';
let sessions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let currentSessionId = null;
let currentMode = 'chat';
let voiceEnabled = localStorage.getItem(VOICE_KEY) !== 'off';
let currentVoiceBtn = null;

function saveSession() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
}

function getSession(id) { return sessions.find(s => s.id === id); }
function currentSession() { return getSession(currentSessionId); }

function newSession() {
  const id = Date.now().toString();
  sessions.unshift({ id, title: 'New conversation', messages: [], created: Date.now() });
  saveSession();
  return id;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function parseMarkdown(text) {
  return escapeHtml(text)
    .replace(/\*\*\*(.+?)\*\*\*/g, '<em><strong>$1</strong></em>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\_\_(.+?)\_\_/g, '<strong>$1</strong>')
    .replace(/\_(.+?)\_/g, '<em>$1</em>');
}

function renderSidebar() {
  const list = document.getElementById('session-list');
  if (sessions.length === 0) {
    list.innerHTML = '<div style="padding:1rem 1.25rem;font-family:var(--font-ui);font-size:13px;color:var(--text-muted);">No conversations yet</div>';
    return;
  }
  list.innerHTML = sessions.map(s => `
    <div class="session-item ${s.id === currentSessionId ? 'active' : ''}" data-id="${s.id}">
      <span class="session-title">${escapeHtml(s.title)}</span>
      <button class="session-delete" data-id="${s.id}" title="Delete">×</button>
    </div>
  `).join('');
  list.querySelectorAll('.session-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.classList.contains('session-delete')) return;
      loadSession(el.dataset.id);
      closeSidebar();
    });
  });
  list.querySelectorAll('.session-delete').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      deleteSession(btn.dataset.id);
    });
  });
}

function deleteSession(id) {
  sessions = sessions.filter(s => s.id !== id);
  saveSession();
  if (currentSessionId === id) {
    currentSessionId = sessions.length > 0 ? sessions[0].id : newSession();
    loadSession(currentSessionId);
  }
  renderSidebar();
}

function loadSession(id) {
  currentSessionId = id;
  renderMessages();
  renderSidebar();
}

function renderMessages() {
  const s = currentSession();
  const el = document.getElementById('messages');
  if (!s || s.messages.length === 0) {
    el.innerHTML = '<div class="empty-state">Begin.</div>';
    return;
  }
  el.innerHTML = s.messages.map((m, i) => `
    <div class="message ${m.role}" data-index="${i}">
      <div class="message-header">
        <div class="message-label">${m.role === 'user' ? 'you' : 'widget'}</div>
        ${m.role === 'assistant' ? `<button class="voice-btn" data-index="${i}" title="Read aloud">▶</button>` : ''}
      </div>
      <div class="message-body">${m.role === 'assistant' ? parseMarkdown(m.content) : escapeHtml(m.content)}</div>
    </div>
  `).join('');
  if (voiceEnabled) {
    el.querySelectorAll('.voice-btn').forEach(btn => {
      btn.style.display = 'inline';
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.index);
        toggleSpeak(currentSession().messages[idx].content, btn);
      });
    });
  }
  el.scrollTop = el.scrollHeight;
}

function addThinkingIndicator() {
  const el = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message thinking';
  div.id = 'thinking';
  div.innerHTML = '<div class="message-header"><div class="message-label">widget</div></div><div class="message-body">Writing…</div>';
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function removeThinkingIndicator() {
  const t = document.getElementById('thinking');
  if (t) t.remove();
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === mode);
  });
  const isChat = mode === 'chat';
  document.getElementById('messages').style.display = isChat ? 'flex' : 'none';
  document.getElementById('input-area').style.display = isChat ? 'block' : 'none';
  document.getElementById('analyze-panel').style.display = isChat ? 'none' : 'flex';
}

function showApp() {
  document.getElementById('key-setup').style.display = 'none';
  document.getElementById('mode-tabs').style.display = 'flex';
  setMode(currentMode);
}

function showKeySetup() {
  document.getElementById('key-setup').style.display = 'flex';
  document.getElementById('mode-tabs').style.display = 'none';
  document.getElementById('messages').style.display = 'none';
  document.getElementById('input-area').style.display = 'none';
  document.getElementById('analyze-panel').style.display = 'none';
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-overlay').classList.add('open');
  renderSidebar();
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// Voice
function stopSpeaking() {
  window.speechSynthesis.cancel();
  if (currentVoiceBtn) {
    currentVoiceBtn.textContent = '▶';
    currentVoiceBtn.classList.remove('speaking');
    currentVoiceBtn = null;
  }
}

function speak(text, btn) {
  stopSpeaking();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.95;
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => v.name.includes('Samantha') || v.name.includes('Karen') || v.name.includes('Daniel') || v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en'));
  if (preferred) utter.voice = preferred;
  if (btn) { btn.textContent = '◼'; btn.classList.add('speaking'); currentVoiceBtn = btn; }
  utter.onend = () => { if (btn) { btn.textContent = '▶'; btn.classList.remove('speaking'); } currentVoiceBtn = null; };
  utter.onerror = () => { if (btn) { btn.textContent = '▶'; btn.classList.remove('speaking'); } currentVoiceBtn = null; };
  window.speechSynthesis.speak(utter);
}

function toggleSpeak(text, btn) {
  if (btn && btn.classList.contains('speaking')) { stopSpeaking(); } else { speak(text, btn); }
}

function updateVoiceBtn() {
  document.getElementById('voice-toggle-btn').textContent = voiceEnabled ? 'voice on' : 'voice off';
}

document.getElementById('voice-toggle-btn').addEventListener('click', () => {
  voiceEnabled = !voiceEnabled;
  localStorage.setItem(VOICE_KEY, voiceEnabled ? 'on' : 'off');
  updateVoiceBtn();
  if (!voiceEnabled) stopSpeaking();
  renderMessages();
});

// Theme
let theme = localStorage.getItem(THEME_KEY) || 'dark';
document.documentElement.setAttribute('data-theme', theme);
document.getElementById('theme-btn').textContent = theme === 'dark' ? 'light' : 'dark';

document.getElementById('theme-btn').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem(THEME_KEY, theme);
  document.getElementById('theme-btn').textContent = theme === 'dark' ? 'light' : 'dark';
});

// Send
async function send() {
  const input = document.getElementById('message-input');
  const text = input.value.trim();
  if (!text || !apiKey) return;
  const s = currentSession();
  if (!s) return;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;
  s.messages.push({ role: 'user', content: text });
  if (s.messages.length === 1) s.title = text.slice(0, 48) + (text.length > 48 ? '…' : '');
  saveSession();
  renderMessages();
  addThinkingIndicator();
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 2048, system: SYSTEM, messages: s.messages.map(m => ({ role: m.role, content: m.content })) })
    });
    const data = await res.json();
    removeThinkingIndicator();
    const reply = data.error ? 'Error: ' + data.error.message : data.content[0].text;
    s.messages.push({ role: 'assistant', content: reply });
    saveSession();
    renderMessages();
    if (!data.error && voiceEnabled) {
      const btns = document.querySelectorAll('.voice-btn');
      speak(reply, btns[btns.length - 1] || null);
    }
  } catch (err) {
    removeThinkingIndicator();
    s.messages.push({ role: 'assistant', content: 'Something went wrong. Check your connection and try again.' });
    saveSession();
    renderMessages();
  }
  document.getElementById('send-btn').disabled = false;
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

// Analyze
async function runAnalyze() {
  const passage = document.getElementById('passage-input').value.trim();
  if (!passage || !apiKey) return;
  const context = document.getElementById('analyze-context-input').value.trim();
  const btn = document.getElementById('analyze-btn');
  const output = document.getElementById('analyze-output');
  btn.disabled = true;
  const userContent = context ? `PASSAGE:\n\n${passage}\n\nCONTEXT FROM THE WRITER:\n\n${context}` : `PASSAGE:\n\n${passage}`;
  const resultEl = document.createElement('div');
  resultEl.className = 'analyze-result analyze-thinking';
  resultEl.innerHTML = `
    <div class="analyze-result-label">analysis</div>
    <div class="analyze-result-passage">${escapeHtml(passage.slice(0, 200))}${passage.length > 200 ? '…' : ''}</div>
    <div class="analyze-result-body">Reading…</div>
  `;
  const empty = output.querySelector('.analyze-empty');
  if (empty) empty.remove();
  if (output.children.length > 0) {
    const hr = document.createElement('hr');
    hr.className = 'analyze-divider';
    output.insertBefore(hr, output.firstChild);
  }
  output.insertBefore(resultEl, output.firstChild);
  output.scrollTop = 0;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 2048, system: ANALYZE_SYSTEM, messages: [{ role: 'user', content: userContent }] })
    });
    const data = await res.json();
    const bodyEl = resultEl.querySelector('.analyze-result-body');
    resultEl.classList.remove('analyze-thinking');
    bodyEl.innerHTML = data.error ? escapeHtml('Error: ' + data.error.message) : parseMarkdown(data.content[0].text);
  } catch (err) {
    resultEl.querySelector('.analyze-result-body').textContent = 'Something went wrong. Check your connection and try again.';
    resultEl.classList.remove('analyze-thinking');
  }
  btn.disabled = false;
}

// Event listeners
document.getElementById('save-key-btn').addEventListener('click', () => {
  const val = document.getElementById('api-key-input').value.trim();
  const err = document.getElementById('key-error');
  if (!val.startsWith('sk-ant-')) {
    err.textContent = 'Keys start with sk-ant-';
    err.style.display = 'block';
    return;
  }
  apiKey = val;
  localStorage.setItem(API_KEY_STORAGE, apiKey);
  err.style.display = 'none';
  document.getElementById('api-key-input').value = '';
  showApp();
  renderMessages();
});

document.getElementById('api-key-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('save-key-btn').click();
});

document.getElementById('key-btn').addEventListener('click', showKeySetup);

document.getElementById('clear-btn').addEventListener('click', () => {
  const s = currentSession();
  if (!s) return;
  if (confirm('Clear this conversation?')) {
    s.messages = [];
    s.title = 'New conversation';
    saveSession();
    renderSidebar();
    renderMessages();
  }
});

document.getElementById('history-btn').addEventListener('click', openSidebar);
document.getElementById('sidebar-overlay').addEventListener('click', closeSidebar);
document.getElementById('new-session-btn').addEventListener('click', () => {
  currentSessionId = newSession();
  loadSession(currentSessionId);
  closeSidebar();
});

document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => { if (apiKey) setMode(tab.dataset.mode); });
});

document.getElementById('send-btn').addEventListener('click', send);
document.getElementById('message-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('message-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 200) + 'px';
});

document.getElementById('analyze-btn').addEventListener('click', runAnalyze);

updateVoiceBtn();

// Boot
if (!apiKey) {
  showKeySetup();
} else {
  if (sessions.length === 0) currentSessionId = newSession();
  else currentSessionId = sessions[0].id;
  showApp();
  renderMessages();
  renderSidebar();
}
</script>
</body>
</html>
